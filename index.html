<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>النايف للتمور | اطلب الآن</title>
<meta name="description" content="تمور فاخرة من النايف — جميع الأنواع جديدة، إنتاج الموسم. اطلب الآن عبر هنقرستيشن، جاهز، ذا شيفز، أو من متجرنا مباشرة.">
<meta property="og:title" content="النايف للتمور | اطلب الآن">
<meta property="og:description" content="جميع التمور جديدة، إنتاج الموسم. توصيل فوري">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌴</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Lalezar&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0e0904;
    --bg-1:#1c130a;
    --bg-2:#241a0e;
    --gold:#c9a85c;
    --gold-bright:#e7cd8f;
    --cream:#f4ead2;
    --cream-dim:#cdbfa0;
    --line:rgba(201,168,92,0.22);
    --shadow:0 10px 30px rgba(0,0,0,0.45);
    --radius:16px;
    --maxw:460px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(120% 60% at 50% 0%, var(--bg-2) 0%, var(--bg-1) 45%, var(--bg-0) 100%);
    color:var(--cream);
    font-family:'Cairo',sans-serif;
    min-height:100%;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--gold);color:#1c130a;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}

  .wrap{
    max-width:var(--maxw);
    margin:0 auto;
    padding:28px 20px 40px;
    position:relative;
  }

  /* زخرفة سعف خفيفة أعلى ويسار/يمين الصفحة */
  .palm-deco{
    position:fixed;
    inset:0;
    pointer-events:none;
    background-repeat:no-repeat;
    opacity:0.16;
    z-index:0;
    background-image:
      radial-gradient(circle at 8% 4%, rgba(201,168,92,0.35), transparent 40%),
      radial-gradient(circle at 95% 10%, rgba(201,168,92,0.25), transparent 35%);
  }

  header{
    text-align:center;
    position:relative;
    z-index:1;
  }
  .logo{
    width:180px;
    max-width:52%;
    margin:0 auto 6px;
    display:block;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,0.5));
  }

  h1{
    text-align:center;
    font-family:'Lalezar',cursive;
    font-weight:400;
    font-size:clamp(28px,7.5vw,36px);
    line-height:1.4;
    letter-spacing:0.5px;
    margin:18px 0 4px;
    color:var(--gold-bright);
    text-shadow:0 2px 12px rgba(0,0,0,0.4);
  }
  h1 span{display:block;}

  .sub{
    font-size:15px;
    color:var(--cream-dim);
    margin:0 0 22px;
    letter-spacing:0.2px;
    text-align:center;
  }

  .hero{
    position:relative;
    z-index:1;
    border-radius:22px;
    overflow:hidden;
    box-shadow:var(--shadow);
    border:1px solid var(--line);
  }
  .hero img{
    width:100%;
    display:block;
  }
  .hero-tag{
    position:absolute;
    bottom:14px;
    right:14px;
    background:rgba(14,9,4,0.72);
    border:1px solid var(--line);
    color:var(--gold-bright);
    font-size:13px;
    font-weight:700;
    padding:7px 14px;
    border-radius:999px;
    backdrop-filter:blur(4px);
  }

  .hero-tag-inline{
    display:block;
    width:fit-content;
    margin:20px auto 0;
    background:rgba(201,168,92,0.14);
    border:1px solid var(--line);
    color:var(--gold-bright);
    font-size:13.5px;
    font-weight:700;
    padding:7px 16px;
    border-radius:999px;
    text-align:center;
  }

  .cta-primary{
    display:block;
    width:100%;
    margin:10px 0 6px;
    padding:17px 20px;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:#1c130a;
    font-weight:800;
    font-size:19px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    box-shadow:0 8px 22px rgba(201,168,92,0.28);
    transition:transform .15s ease;
  }
  .cta-primary:active{transform:scale(0.97);}

  .delivery-hint{
    text-align:center;
    font-size:13.5px;
    color:var(--cream-dim);
    margin:2px 0 24px;
  }

  section.group{
    margin-top:8px;
    position:relative;
    z-index:1;
  }
  .divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:30px 0 16px;
    color:var(--cream-dim);
    font-size:13px;
  }
  .divider::before,.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .btn-row{display:flex;flex-direction:column;gap:14px;}

  .service-btn{
    --accent:#c9a85c;
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    background:linear-gradient(180deg, #fbf6e9, #f3ead4);
    border:1px solid rgba(0,0,0,0.05);
    border-radius:18px;
    padding:12px 16px 12px 14px;
    box-shadow:0 8px 20px rgba(0,0,0,0.32), inset 0 1px 0 rgba(255,255,255,0.5);
    cursor:pointer;
    overflow:hidden;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .service-btn::before{
    content:"";
    position:absolute;
    top:0; right:0; bottom:0;
    width:5px;
    background:var(--accent);
  }
  .service-btn:active{transform:scale(0.97);}

  .logo-chip{
    flex-shrink:0;
    width:54px;
    height:54px;
    border-radius:13px;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.12), inset 0 0 0 1px rgba(0,0,0,0.04);
    padding:8px;
  }
  .logo-chip img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    display:block;
  }

  .text-block{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:2px;
    text-align:center;
  }
  .service-btn .label{
    font-weight:800;
    font-size:15.5px;
    color:#241a0e;
    line-height:1.3;
  }
  .service-btn .caption{
    font-size:11.5px;
    font-weight:600;
    color:#8a7a5c;
  }

  .chev-circle{
    flex-shrink:0;
    width:32px;
    height:32px;
    border-radius:50%;
    background:rgba(36,26,14,0.06);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .service-btn .chev{
    color:#6b5b3a;
  }

  .service-btn.highlight{
    animation:pulseGlow 1.1s ease 2;
  }
  @keyframes pulseGlow{
    0%{box-shadow:0 8px 20px rgba(0,0,0,0.32), inset 0 1px 0 rgba(255,255,255,0.5);}
    50%{box-shadow:0 8px 30px rgba(201,168,92,0.6), inset 0 1px 0 rgba(255,255,255,0.5);}
    100%{box-shadow:0 8px 20px rgba(0,0,0,0.32), inset 0 1px 0 rgba(255,255,255,0.5);}
  }

  .app-block{
    text-align:center;
    margin-top:34px;
  }
  .app-block .headline{
    font-weight:700;
    font-size:16.5px;
    color:var(--cream);
    margin-bottom:2px;
  }
  .app-block .discount{
    color:var(--gold-bright);
    font-weight:800;
    font-size:15px;
    margin-bottom:16px;
  }
  .store-row{
    display:flex;
    gap:10px;
    justify-content:center;
  }
  .store-btn{
    flex:1;
    max-width:170px;
    background:#100b06;
    border:1px solid var(--line);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:10px 8px;
    cursor:pointer;
  }
  .store-btn svg{width:22px;height:22px;flex-shrink:0;}
  .store-btn .txt{
    text-align:right;
    line-height:1.15;
  }
  .store-btn .txt .small{
    display:block;
    font-size:9.5px;
    color:var(--cream-dim);
  }
  .store-btn .txt .big{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--cream);
  }

  .site-block{
    text-align:center;
    margin-top:34px;
  }
  .site-block p{
    font-size:14px;
    color:var(--cream-dim);
    margin:0 0 8px;
  }
  .site-link{
    display:inline-block;
    font-weight:700;
    font-size:16px;
    color:var(--gold-bright);
    padding:10px 22px;
    border:1px solid var(--line);
    border-radius:999px;
  }

  footer{
    text-align:center;
    margin-top:36px;
    font-size:12px;
    color:rgba(205,191,160,0.5);
  }

  @media (prefers-reduced-motion: reduce){
    .service-btn.highlight{animation:none;}
    .cta-primary{transition:none;}
  }

  .logo-chip svg{width:100%;height:100%;display:block;}
  .delivery-hint{font-size:25px;font-weight:900;color:var(--gold-bright);margin:6px 0 22px;line-height:1.4;text-shadow:0 2px 14px rgba(0,0,0,.45);}
  .delivery-hint::after{content:'';display:block;width:64px;height:4px;border-radius:4px;margin:12px auto 0;background:linear-gradient(90deg,#b8862b,#f6d77a,#b8862b);}
  #deliveryGroup .logo-chip{width:92px;height:92px;border-radius:20px;}
  #deliveryGroup .service-btn{padding-top:12px;padding-bottom:12px;}
  .more-hint{text-align:center;font-size:13.5px;color:var(--cream-dim);margin:26px 0 14px;}
</style>
</head>

<script>
  // ---- Tracking helpers ----
  // ClickButton = حدث التحسين في حملة TikTok (يُرسل فقط من أزرار الطلب/التحميل/الموقع)
  // click_* = أحداث مخصصة للتحليل التفصيلي (كما كانت)
  var _last = {};
  function trackCta(name){
    var now = Date.now();
    if (_last[name] && now - _last[name] < 1500) return; // منع التكرار عند النقر المزدوج
    _last[name] = now;
    if (!window.ttq) return;
    var key = name.replace(/^click_/, '');
    ttq.track('ClickButton', {content_name: key});
    ttq.track(name, {content_name: name});
  }

  // ---- الأزرار الفعلية ----
  document.querySelectorAll('[data-event]').forEach(function(el){
    el.addEventListener('click', function(){
      trackCta(el.getAttribute('data-event'));
    });
  });

  // ---- تمرير UTM القادمة من TikTok إلى رابط الموقع (يفرق بين الفيديوهات A/B) ----
  (function(){
    var keys = ['utm_source','utm_medium','utm_campaign','utm_id','utm_content','ttclid'];
    var incoming = new URLSearchParams(location.search);
    var has = keys.some(function(k){ return incoming.get(k); });
    if (!has) return;
    document.querySelectorAll('a[data-pass-utm]').forEach(function(a){
      try {
        var u = new URL(a.href);
        keys.forEach(function(k){
          var v = incoming.get(k);
          if (v) u.searchParams.set(k, v);
        });
        a.href = u.toString();
      } catch(e){}
    });
  })();
</script>
